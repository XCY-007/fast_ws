/**:
  ros__parameters:
    common:
      img_topic: "/camera/color/image_raw"
      lid_topic: "/livox/lidar"
      imu_topic: "/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false

    extrin_calib:
      # radar/MID360 frame to imu_link. Both links are fixed on the Go2 trunk.
      extrinsic_T: [0.31502, 0.0, -0.089145]
      extrinsic_R: [-0.965517, 0.0, 0.260340,
                    0.0, 1.0, 0.0,
                    -0.260340, 0.0, -0.965517]
      # radar/MID360 frame to camera_color_optical_frame.
      Rcl: [-0.260340, 0.0, -0.965517,
            0.0, -1.0, 0.0,
            -0.965517, 0.0, 0.260340]
      Pcl: [0.109294, 0.032500, -0.034728]

    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.05
      lidar_type: 7
      scan_line: 64
      blind: 1.2

    vio:
      max_iterations: 5
      outlier_threshold: 1000
      img_point_cov: 100
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: false
      inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5
      gyr_cov: 0.3
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0

    uav:
      imu_rate_odom: false
      gravity_align_en: false

    publish:
      dense_map_en: true
      pub_effect_point_en: true
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "go2_gazebo_mid360"
      pose_output_en: false

    pcd_save:
      pcd_save_en: false
      colmap_output_en: false
      filter_size_pcd: 0.15
      interval: -1
